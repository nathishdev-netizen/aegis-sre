# Serve Aegis through nginx, so the team opens a URL instead of holding an
# SSH tunnel open.
#
#   sudo cp deploy/nginx-aegis.conf /etc/nginx/sites-available/aegis.conf
#   sudo ln -s /etc/nginx/sites-available/aegis.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pick a port nothing else holds - check first:
#   sudo lsof -nP -iTCP:9000 -sTCP:LISTEN
#
# IMPORTANT: Aegis has no login of its own. If this port is open to the
# internet, so are your production logs, incidents and evidence lines. The
# commented allowlist and basic auth below are the only access control
# there is; uncomment them or scope the port in your firewall.

server {
    listen 9000;
    server_name _;

    # Who may reach it at all. `deny all` stays last: nginx takes the first
    # rule that matches.
    # allow 172.31.0.0/16;      # the VPC
    # allow 0.0.0.0;            # office egress - `curl ifconfig.me`
    # deny  all;

    # sudo apt install -y apache2-utils
    # sudo htpasswd -c /etc/nginx/.aegis-htpasswd <your-name>
    # auth_basic           "Aegis";
    # auth_basic_user_file /etc/nginx/.aegis-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The dashboard streams its updates over SSE. Buffering them means
        # the page sits silent until nginx decides the buffer is full,
        # which looks exactly like a dead feed.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
