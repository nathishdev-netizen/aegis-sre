# Serve Aegis through nginx, so the team opens a URL instead of holding an
# SSH tunnel open.
#
#   sudo cp deploy/nginx-aegis.conf /etc/nginx/sites-available/aegis.conf
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.aegis-htpasswd <your-name>
#   sudo htpasswd    /etc/nginx/.aegis-htpasswd <teammate>   # no -c after the first
#   sudo ln -s /etc/nginx/sites-available/aegis.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: Aegis has no login of its own. The allowlist and basic auth
# below ARE the access control. Remove either and anyone who reaches this
# port reads your production logs, incidents and evidence lines.

server {
    listen 8080;
    server_name _;

    # Who may reach it at all. `deny all` stays last: nginx takes the first
    # rule that matches.
    allow 172.31.0.0/16;        # the VPC
    # allow 0.0.0.0;            # your office egress IP - `curl ifconfig.me`
    deny  all;

    auth_basic           "Aegis";
    auth_basic_user_file /etc/nginx/.aegis-htpasswd;

    # One block for every child, however many services are in services.yml.
    # Aegis runs a process per service - 3010 is the overview, children are
    # numbered upward from it - so a location per service would mean editing
    # nginx every time one is added. The capture group makes the port part
    # of the route instead.
    #
    # Narrow by design: 30\d\d only ever reaches 3000-3099, and the two
    # rules above decide who gets this far at all.
    location ~ ^/(30\d\d)/(.*)$ {
        proxy_pass http://127.0.0.1:$1/$2$is_args$args;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The dashboard streams its updates; buffering them defeats the point.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The overview page. Its X-Forwarded headers are not decoration: the
    # supervisor reads them to link its children by relative path rather
    # than by 127.0.0.1, which from a browser means the reader's own machine.
    location / {
        proxy_pass http://127.0.0.1:3010/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
}
