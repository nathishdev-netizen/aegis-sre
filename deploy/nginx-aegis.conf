# Serve Aegis through nginx at /aegis/, so the team can open a URL instead
# of holding an SSH tunnel open.
#
# Paste this into an existing `server { }` block, or include it from one.
#
# IMPORTANT: Aegis has no login of its own. Everything here is the access
# control - the allowlist decides who can reach it at all, and basic auth
# decides who gets in. Without both, anyone who finds the path reads your
# production logs, incidents and evidence lines.
#
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.aegis-htpasswd <your-name>
#   sudo htpasswd    /etc/nginx/.aegis-htpasswd <teammate>     # no -c after the first
#   sudo nginx -t && sudo systemctl reload nginx

# ---- the overview page ------------------------------------------------
location /aegis/ {
    # Who may reach it at all. Narrow this to your own ranges; `deny all`
    # must stay last, because nginx takes the first rule that matches.
    allow 172.31.0.0/16;        # the VPC
    # allow 14.143.179.162;     # office egress IP - add yours
    deny  all;

    auth_basic           "Aegis";
    auth_basic_user_file /etc/nginx/.aegis-htpasswd;

    proxy_pass http://127.0.0.1:3010/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The supervisor reads these to know it is proxied, and links its
    # children by relative path rather than by 127.0.0.1 - which, from a
    # browser, means the reader's own machine.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The page refreshes every 10s and must never be served stale.
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# ---- one block per watched service ------------------------------------
# Children are numbered from the supervisor's port: 3010 -> 3011, 3012, ...
# Add a block per service in services.yml. The trailing slash on proxy_pass
# is what strips the /aegis/3011 prefix before it reaches the child.

location /aegis/3011/ {
    allow 172.31.0.0/16;
    deny  all;
    auth_basic           "Aegis";
    auth_basic_user_file /etc/nginx/.aegis-htpasswd;

    proxy_pass http://127.0.0.1:3011/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The dashboard streams its updates; buffering them defeats the point.
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location /aegis/3012/ {
    allow 172.31.0.0/16;
    deny  all;
    auth_basic           "Aegis";
    auth_basic_user_file /etc/nginx/.aegis-htpasswd;

    proxy_pass http://127.0.0.1:3012/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_read_timeout 3600s;
}
