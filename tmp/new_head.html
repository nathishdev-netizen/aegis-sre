<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Intelligence</title>
  <style>
    /* ============================================================
       Design tokens. Both themes are defined here and nowhere else,
       so a colour can never be hard-coded into a component and
       break the other theme.
       ============================================================ */
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg:        #0b0e14;
      --bg-raised: #111621;
      --surface:   #151b28;
      --surface-2: #1a2130;
      --line:      #232c3d;
      --line-soft: #1b2231;
      --text:      #e8edf5;
      --text-2:    #9aabc2;
      --text-3:    #6b7d96;
      --accent:    #4c8dff;
      --accent-bg: rgba(76,141,255,.13);
      --ok:        #2fd48f;
      --ok-bg:     rgba(47,212,143,.13);
      --warn:      #f5b544;
      --warn-bg:   rgba(245,181,68,.13);
      --bad:       #ff6b6b;
      --bad-bg:    rgba(255,107,107,.13);
      --hollow:    #b98cff;
      --hollow-bg: rgba(185,140,255,.14);
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
      --radius:    10px;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg:        #f6f8fb;
      --bg-raised: #ffffff;
      --surface:   #ffffff;
      --surface-2: #f2f5fa;
      --line:      #e2e8f2;
      --line-soft: #edf1f7;
      --text:      #0f1826;
      --text-2:    #56657c;
      --text-3:    #8494ab;
      --accent:    #2563eb;
      --accent-bg: rgba(37,99,235,.09);
      --ok:        #0f9d63;
      --ok-bg:     rgba(15,157,99,.10);
      --warn:      #b7791f;
      --warn-bg:   rgba(183,121,31,.11);
      --bad:       #dc2626;
      --bad-bg:    rgba(220,38,38,.09);
      --hollow:    #7c3aed;
      --hollow-bg: rgba(124,58,237,.10);
      --shadow:    0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px;
      border: 3px solid transparent; background-clip: content-box; }
    a { color: var(--accent); text-decoration: none; }

    /* ---------- app frame ---------- */
    .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .rail { background: var(--bg-raised); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .rail-head { padding: 18px 16px 14px; }
    .wordmark { display: flex; align-items: center; gap: 9px; font-weight: 700;
      font-size: 15px; letter-spacing: -.01em; }
    .spark { width: 22px; height: 22px; border-radius: 7px; flex: none;
      background: linear-gradient(135deg, var(--accent), var(--hollow));
      display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; }
    .rail-sub { color: var(--text-3); font-size: 11.5px; margin-top: 7px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 1px;
      overflow-y: auto; }
    .nav-group { color: var(--text-3); font-size: 10px; font-weight: 700;
      letter-spacing: .11em; text-transform: uppercase; padding: 14px 8px 5px; }
    .nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 9px;
      border-radius: 8px; color: var(--text-2); font-size: 13.5px; font-weight: 500;
      cursor: pointer; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
    .nav-item .ic { width: 15px; text-align: center; opacity: .85; font-size: 13px; }
    .nav-badge { margin-left: auto; min-width: 19px; text-align: center;
      background: var(--surface-2); color: var(--text-2); border-radius: 99px;
      padding: 1px 7px; font-size: 10.5px; font-weight: 700; }
    .nav-badge.bad { background: var(--bad-bg); color: var(--bad); }
    .nav-badge.warn { background: var(--warn-bg); color: var(--warn); }
    .rail-foot { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: none; border: 1px solid var(--line); color: var(--text-2);
      border-radius: 7px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
    .icon-btn:hover { color: var(--text); border-color: var(--text-3); }

    /* ---------- main ---------- */
    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
      gap: 12px; padding: 11px 22px; background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .crumb { font-weight: 650; font-size: 15px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line);
      background: var(--surface); border-radius: 99px; padding: 4px 11px;
      font-size: 12px; color: var(--text-2); cursor: pointer; }
    .chip:hover { border-color: var(--text-3); }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
    .chip.live .dot { background: var(--ok); box-shadow: 0 0 0 0 var(--ok-bg);
      animation: beat 2.4s infinite; }
    .chip.live { color: var(--text); }
    @keyframes beat { 70% { box-shadow: 0 0 0 7px transparent; } }
    .grow { flex: 1; }
    .content { padding: 22px; max-width: 1420px; width: 100%; }

    /* ---------- primitives ---------- */
    .card { background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px 18px; }
    .card + .card { margin-top: 12px; }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text-3); margin: 26px 0 10px; }
    .section-title:first-child { margin-top: 0; }
    .lede { color: var(--text-2); font-size: 13px; margin: -2px 0 14px; }
    .muted, .hint { color: var(--text-2); font-size: 12.5px; }
    .faint { color: var(--text-3); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 7px 13px; font-size: 13px; font-weight: 550;
      cursor: pointer; }
    .btn:hover { border-color: var(--text-3); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .45; cursor: default; }
    .input { background: var(--bg); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none; width: 100%; }
    .input:focus { border-color: var(--accent); }
    .row { display: flex; gap: 8px; align-items: center; }
    .grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
    @media (max-width: 1050px) { .grid2 { grid-template-columns: 1fr; } }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .rail { position: static; height: auto; flex-direction: row; align-items: center;
        overflow-x: auto; }
      .rail-head, .rail-foot { border: none; }
      .nav { flex-direction: row; }
      .nav-group, .rail-sub { display: none; }
    }
  </style>
</head>
