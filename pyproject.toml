[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-intelligence-agent"
version = "1.0.0"
description = "Local-first log intelligence: a live plain-English brief, run verdicts (achieved / failed / hollow), incidents with ranked causes, precedent memory, governed explanations, and draft fix proposals - from any project's log file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # standard library only, by design

[project.optional-dependencies]
dotenv = ["python-dotenv"]

[project.scripts]
log-agent = "app.cli:main"
log-agent-mcp = "app.cli:mcp_main"

[tool.setuptools.packages.find]
include = ["app*", "aegis*"]
exclude = ["tests*", "demo*"]
